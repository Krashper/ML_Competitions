<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <!-- Фейковая форма со всеми видами полей -->
        <h1>Customer Segmentation Tool</h1>
        <form action="/fake_predict" method="POST" enctype="multipart/form-data">

            <!-- Текстовое поле -->
            <div class="form-group">
                <label for="customer_name">Имя клиента:</label>
                <input type="text" id="customer_name" name="customer_name" placeholder="Введите имя">
            </div>

            <!-- Выпадающий список (уже был) -->
            <div class="form-group">
                <label for="Gender">Пол:</label>
                <select id="Gender" name="Gender" required>
                    <option value="" disabled selected>Выберите пол</option>
                    <option value="Male">Мужской</option>
                    <option value="Female">Женский</option>
                </select>
            </div>

            <!-- Числовые поля (уже были) -->
            <div class="form-group">
                <label for="Age">Возраст:</label>
                <input type="number" id="Age" name="Age" min="18" max="100" step="1" required>
            </div>

            <!-- Текстовая область -->
            <div class="form-group">
                <label for="comments">Комментарии:</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Дополнительная информация"></textarea>
            </div>

            <!-- Переключатели (radio) -->
            <div class="form-group">
                <label>Тип клиента:</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="customer_type" value="regular" checked>
                        Обычный
                    </label>
                    <label>
                        <input type="radio" name="customer_type" value="vip">
                        VIP
                    </label>
                </div>
            </div>

            <!-- Чекбоксы -->
            <div class="form-group">
                <label>Предпочтения:</label>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="preferences" value="online">
                        Онлайн-покупки
                    </label>
                    <label>
                        <input type="checkbox" name="preferences" value="discounts">
                        Скидки
                    </label>
                    <label>
                        <input type="checkbox" name="preferences" value="new_products">
                        Новые продукты
                    </label>
                </div>
            </div>

            <!-- Загрузка файла -->
            <div class="form-group">
                <label for="customer_photo">Фото клиента (опционально):</label>
                <input type="file" id="customer_photo" name="customer_photo" accept="image/*">
            </div>

            <!-- Кнопки -->
            <div class="button-group">
                <button type="submit" class="btn-submit">Анализировать</button>
                <button type="reset" class="btn-reset">Очистить</button>
            </div>
        </form>

        <!-- Форма для текущего примера -->
        <h1>Предсказание Spending Score</h1>
        <form action="/predict" method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label for="Gender">Пол:</label>
                <select id="Gender" name="Gender" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label for="Age">Возраст:</label>
                <input type="number" name="Age" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="Annual Income (k$)">Годовой доход:</label>
                <input type="number" name="Annual Income (k$)" step="0.01" required>
            </div>

            <button type="submit">Узнать Spending Score</button>
        </form>

        {% if prediction %}
            <div class="result success">
                <h2>Результат: {{ prediction }}</h2>

                <!-- Для примера -->
                <img src="/static/images/results.png" alt="">
            </div>
        {% endif %}

        {% if error %}
            <div class="result error">
                <h2>Ошибка: {{ error }}</h2>
            </div>
        {% endif %}
    </div>
</body>
</html>
